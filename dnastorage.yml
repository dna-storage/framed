name: dnastorage
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python runtime
  - python>=3.9,<3.13
  - pip>=23

  # Core scientific stack
  - numpy>=1.23
  - scipy>=1.8
  - h5py>=3.7
  - pandas>=1.4
  - matplotlib>=3.5
  - seaborn>=0.12

  # Bioinformatics
  - biopython>=1.79
  - muscle>=5.1

  # DNA-storage specific
  - bitarray>=2.5
  - editdistance>=0.6
  - python-levenshtein>=0.12
  - importlib_metadata>=4.11

  # Parallel / distributed
  - openmpi
  - mpi4py>=3.1
  - dill>=0.3
  - joblib>=1.1

  # Logging / utilities
  - structlog>=22.1

  # Notebook / interactive
  - jupyter
  - jupyterlab>=3
  - ipywidgets

  # Testing / dev
  - pytest>=7